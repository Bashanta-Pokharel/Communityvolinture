{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><span class="eyebrow">Organization identity</span><h1 class="fw-bold">Organization profile</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post" enctype="multipart/form-data"><div class="text-center mb-4">{% if organization and organization.logo_filename %}<img class="org-logo" src="{{url_for('static',filename=organization.logo_filename)}}" alt="Organization logo">{% else %}<div class="org-logo placeholder-avatar">O</div>{% endif %}<label class="form-label d-block mt-2">Organization logo</label><input class="form-control" type="file" name="logo" accept="image/png,image/jpeg,image/gif,image/webp"></div><div class="row"><div class="col-md-6"><label class="form-label">Organization name</label><input class="form-control mb-3" name="organization_name" value="{{organization.organization_name if organization else ''}}" required></div><div class="col-md-6"><label class="form-label">Contact person</label><input class="form-control mb-3" name="contact_person" value="{{organization.contact_person if organization else ''}}" required></div></div><div class="row"><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{organization.phone if organization else ''}}"></div><div class="col-md-6"><label class="form-label">District only</label><input class="form-control mb-3" name="location" value="{{organization.location if organization else ''}}" placeholder="District only, e.g. Kathmandu"></div></div><label class="form-label">About the organization</label><textarea class="form-control mb-3" name="description" rows="4">{{organization.description if organization else ''}}</textarea><button class="btn btn-success">Save organization profile</button></form></div></div></div></div></div>{% endblock %}
