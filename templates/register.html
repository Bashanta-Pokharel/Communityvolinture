{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-9 col-lg-7"><div class="card border-0 shadow"><div class="card-body p-4 p-md-5"><h2 class="fw-bold">Create your volunteer account</h2><p class="text-muted">Start with your basic details. You can add your skills and photo next.</p><form method="post"><div class="row"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required></div><div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control mb-3" type="date" name="date_of_birth" required></div></div><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="6" required><button class="btn btn-success w-100">Create volunteer account</button></form><p class="text-center mt-4 mb-0">Already have an account? <a class="fw-semibold" href="{{url_for('login')}}">Log in</a></p></div></div></div></div></div>{% endblock %}
