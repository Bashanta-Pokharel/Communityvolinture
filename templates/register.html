ß{% extends 'base.html' %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-7">
      <div class="card border-0 shadow">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold">Create your volunteer account</h2>
          <p class="text-muted">
            Start with your basic details. You can add your skills and photo
            next.
          </p>

          <form method="post">
            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="name">Full name</label>
                <input
                 ß class="form-control mb-3"
                  id="name"
                  name="name"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="username">Username</label>
                <input
                  class="form-control mb-1"
                  id="username"
                  name="username"
                  minlength="3"
                  maxlength="30"
                  pattern="[A-Za-z0-9_]+"
                  autocomplete="username"
                  required
                />
                <small class="text-muted d-block mb-3"
                  >Use letters, numbers, or underscores only.</small
                >
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="dateOfBirth"
                  >Date of birth</label
                >
                <input
                  class="form-control mb-3"
                  id="dateOfBirth"
                  type="date"
                  name="date_of_birth"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input
                  class="form-control mb-3"
                  id="email"
                  type="email"
                  name="email"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <label class="form-label" for="password">Password</label>
                <input
                  class="form-control mb-3"
                  id="password"
                  type="password"
                  name="password"
                  minlength="6"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="confirmPassword"
                  >Confirm password</label
                >
                <input
                  class="form-control mb-4"
                  id="confirmPassword"
                  type="password"
                  name="confirm_password"
                  minlength="6"
                  required
                />
              </div>
            </div>
            <button class="btn btn-success w-100">
              Create volunteer account
            </button>
          </form>

          <p class="text-center mt-4 mb-0">
            Already have an account?
            <a class="fw-semibold" href="{{ url_for('login') }}">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
