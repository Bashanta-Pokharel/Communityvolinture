{% extends 'base.html' %}{% block content %}{% set days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><h1 class="fw-bold">Edit volunteer</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post"><div class="row"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{volunteer.name}}"></div><div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control mb-3" type="date" name="date_of_birth" value="{{volunteer.date_of_birth or ''}}"></div></div><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{volunteer.email}}"><label class="form-label">Skills</label><input class="form-control mb-3" name="skills" value="{{volunteer.skills or ''}}"><label class="form-label">Interests</label><input class="form-control mb-3" name="interests" value="{{volunteer.interests or ''}}"><label class="form-label">Free days</label><div class="check-grid mb-3">{% for day in days %}<div class="form-check"><input class="form-check-input" type="checkbox" name="availability" value="{{day}}" id="day{{loop.index}}" {% if volunteer.availability and day|lower in volunteer.availability|lower %}checked{% endif %}><label class="form-check-label" for="day{{loop.index}}">{{day}}</label></div>{% endfor %}</div><label class="form-label">Location</label><input class="form-control mb-3" name="location" value="{{volunteer.location or ''}}"><button class="btn btn-success">Save volunteer</button><a class="btn btn-link" href="{{url_for('manage_volunteers')}}">Cancel</a></form></div></div></div></div></div>{% endblock %}
