{% extends 'base.html' %}{% block content %}{% set days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><span class="eyebrow">Update work details</span><h1 class="fw-bold">Edit task</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post"><label class="form-label">Task title</label><input class="form-control mb-3" name="title" value="{{task.title}}" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" required>{{task.description}}</textarea><div class="row"><div class="col-md-6"><label class="form-label">Start date</label><input class="form-control mb-3" type="date" name="start_date" value="{{task.start_date or ''}}" required></div><div class="col-md-6"><label class="form-label">End date</label><input class="form-control mb-3" type="date" name="end_date" value="{{task.end_date or ''}}" required></div></div><label class="form-label">Required skills</label><input class="form-control mb-3" name="required_skills" value="{{task.required_skills}}" required><label class="form-label">Task interests</label><input class="form-control mb-3" name="interests" value="{{task.interests}}"><label class="form-label">Days needed</label><div class="check-grid mb-3">{% for day in days %}<div class="form-check"><input class="form-check-input" type="checkbox" name="availability" value="{{day}}" id="day{{loop.index}}" {% if day|lower in task.availability|lower %}checked{% endif %}><label class="form-check-label" for="day{{loop.index}}">{{day}}</label></div>{% endfor %}</div><label class="form-label">District only</label><input class="form-control mb-3" name="location" value="{{task.location}}" placeholder="District only, e.g. Kathmandu" required><button class="btn btn-success">Save task</button></form></div></div></div></div></div>{% endblock %}
