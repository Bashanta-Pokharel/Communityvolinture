{% extends 'base.html' %}{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card border-0 shadow">
        <div class="card-body p-4 p-md-5">
          <span class="eyebrow">Restricted access</span>
          <h1 class="h2 fw-bold">Administrator login</h1>
          <p class="text-muted">
            Only system administrators can open the administration panel.
          </p>
          <form method="post">
            <label class="form-label">Admin username or email</label
            ><input
              class="form-control mb-3"
              name="identifier"
              autocomplete="username"
              required
            /><label class="form-label">Admin password</label
            ><input
              class="form-control mb-4"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            /><button class="btn btn-success w-100">Open admin panel</button>
          </form>
          <div class="login-hint mt-4">
            <b>Admin username:</b> admin<br /><b>Admin email:</b>
            admin@gmail.com
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
