{% extends 'base.html' %}{% block content %}<div class="container py-5"><h1 class="fw-bold">Organization dashboard</h1><p class="text-muted">Post opportunities and manage applicants for your organization.</p><div class="row g-4 my-2"><div class="col-md-6"><div class="card border-0 shadow-sm text-center p-3"><div class="display-6 text-success fw-bold">{{counts.tasks}}</div><span>My posted tasks</span></div></div><div class="col-md-6"><div class="card border-0 shadow-sm text-center p-3"><div class="display-6 text-success fw-bold">{{counts.applications}}</div><span>Applications received</span></div></div></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-success" href="{{url_for('organization_profile')}}">Organization profile</a><a class="btn btn-outline-success" href="{{url_for('manage_tasks')}}">Post / manage my tasks</a><a class="btn btn-outline-success" href="{{url_for('manage_applications')}}">Review my applications</a></div></div>{% endblock %}
