{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><h1 class="fw-bold">Edit organization</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post"><div class="row"><div class="col-md-6"><label class="form-label">Organization name</label><input class="form-control mb-3" name="organization_name" value="{{organization.organization_name}}"></div><div class="col-md-6"><label class="form-label">Contact person</label><input class="form-control mb-3" name="contact_person" value="{{organization.contact_person}}"></div></div><div class="row"><div class="col-md-6"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{organization.email}}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{organization.phone}}"></div></div><label class="form-label">Location</label><input class="form-control mb-3" name="location" value="{{organization.location}}"><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="4">{{organization.description}}</textarea><button class="btn btn-success">Save organization</button><a class="btn btn-link" href="{{url_for('manage_organizations')}}">Cancel</a></form></div></div></div></div></div>{% endblock %}
