{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card border-0 shadow"><div class="card-body p-4 p-md-5"><h1 class="h2 fw-bold">Create an organization account</h1><p class="text-muted">Organizations post and manage their own volunteer opportunities.</p><form method="post"><div class="row"><div class="col-md-6"><label class="form-label">Organization name</label><input class="form-control mb-3" name="organization_name" required></div><div class="col-md-6"><label class="form-label">Contact person</label><input class="form-control mb-3" name="contact_person" required></div></div><div class="row"><div class="col-md-6"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control mb-3" name="phone"></div></div><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><label class="form-label">Location</label><input class="form-control mb-3" name="location" required><label class="form-label">About the organization</label><textarea class="form-control mb-4" name="description" rows="3"></textarea><button class="btn btn-success w-100">Create organization account</button></form><p class="text-center mt-4 mb-0">Already have an account? <a href="{{url_for('login')}}">Log in</a></p></div></div></div></div></div>{% endblock %}
